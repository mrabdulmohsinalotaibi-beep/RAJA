name: RAJA mobile end-to-end
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'format-picker.js'
      - 'app-shell.js'
      - 'organizer.js'
      - 'lessons.js'
      - 'lesson-core.js'
      - 'recorder.js'
      - 'recorder.css'
      - 'auth-client.js'
      - 'password-client.js'
      - 'functions/_lib/**'
      - 'functions/api/auth/**'
      - 'functions/api/admin/**'
      - 'functions/api/site-config.js'
      - 'admin/**'
      - 'site-config.js'
      - 'migrations/**'
      - 'functions/api/organizer.js'
      - 'library.js'
      - 'file-fingerprint.js'
      - 'cloud-sync.js'
      - 'sync-core.js'
      - 'functions/api/sync.js'
      - 'functions/api/cloud-file.js'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: raja-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify daily lessons and mobile playback locally
        run: node tests/cache-version.cjs && node tests/lesson-core.cjs && node tests/listening-parts.cjs && node tests/file-fingerprint.cjs && node tests/lesson-player.cjs && node tests/recorder-shell.cjs && node tests/contact-auth.cjs && node tests/password-auth.cjs && node tests/admin-api.cjs && node tests/admin-ui-e2e.cjs && node tests/password-ui-e2e.cjs && node tests/sync-core.cjs && node tests/cloud-api.cjs && node tests/device-local.cjs && node tests/resume-e2e.cjs && node tests/local-mp3-e2e.cjs && node tests/lessons-e2e.cjs && node tests/classic-layout.cjs && node tests/edit-today-e2e.cjs && node tests/parts-e2e.cjs && node tests/duplicates-e2e.cjs && node tests/repeat-e2e.cjs && node tests/youtube-shortcuts-e2e.cjs
      - name: Verify live RAJA mobile UI with mocked media endpoints
        env:
          RAJA_URL: https://raja.athat.app/
        run: node tests/mobile-smoke.cjs
      - name: Save recorder layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-recorder-previews
          path: layout-previews/
          retention-days: 7
  webkit-native-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit for native audio checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Verify native pause and resume in WebKit
        run: node tests/webkit-native-audio.cjs
