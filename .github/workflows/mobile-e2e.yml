name: RAJA mobile end-to-end
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'format-picker.js'
      - 'app-shell.js'
      - 'organizer.js'
      - 'lessons.js'
      - 'lesson-core.js'
      - 'recorder.js'
      - 'recorder.css'
      - 'auth-client.js'
      - 'functions/_lib/**'
      - 'functions/api/auth/**'
      - 'functions/api/organizer.js'
      - 'library.js'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: raja-mobile-ci-main
  cancel-in-progress: true
jobs:
  mobile-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify daily lessons and mobile playback locally
        run: node tests/cache-version.cjs && node tests/lesson-core.cjs && node tests/lesson-player.cjs && node tests/recorder-shell.cjs && node tests/contact-auth.cjs && node tests/lessons-e2e.cjs
      - name: Verify live RAJA mobile UI with mocked media endpoints
        env:
          RAJA_URL: https://raja.athat.app/
        run: node tests/mobile-smoke.cjs
