name: YouTube live media diagnostics
on:
  pull_request:
    paths: ['tests/youtube-live-probe.mjs', '.github/workflows/youtube-live-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save youtubei.js@latest
      - run: node tests/youtube-live-probe.mjs
      - name: Check current yt-dlp without credentials
        run: |
          python3 -m pip install -U 'yt-dlp[default]'
          timeout 70 python3 -m yt_dlp --no-playlist --socket-timeout 10 --retries 0 --js-runtimes node --simulate --print '%(id)s %(duration)s %(format_id)s' https://www.youtube.com/watch?v=BaW_jenozKc || true
