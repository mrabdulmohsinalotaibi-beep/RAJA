name: RAJA deployed media smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe Render and Cloudflare live services
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          def probe(url, expected, timeout=45):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"RAJA-quality-check/1.0"}),timeout=timeout) as response:
                      status=response.status
                      body=response.read(1500)
              except urllib.error.HTTPError as exc:
                  status=exc.code;body=exc.read(1500)
              print(f"{status} {url.split('?')[0]} {body[:300]!r}")
              if status!=expected:raise SystemExit(f"Expected {expected} got {status}")
              return body
          body=probe("https://raja-media.onrender.com/health",200,90)
          assert json.loads(body).get("ok") is True
          probe("https://raja-media.onrender.com/api/formats?url=https%3A%2F%2Fexample.com%2Fprivate",400)
          probe("https://raja-media.onrender.com/api/download?url=https%3A%2F%2F127.0.0.1%2F&format=mp4&quality=360",400)
          try:
              probe("https://raja.athat.app/api/formats?url=https%3A%2F%2Fexample.com%2Freel",400)
          except SystemExit as exc:
              print("Cloudflare edge did not return the expected 400:",repr(exc))
          PY
      - name: Try licensed Big Buck Bunny YouTube sample metadata and MP3
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json
          # Blender Foundation Big Buck Bunny is released CC BY 3.0.
          video="https://www.youtube.com/watch?v=YE7VzlLtp-4"
          root="https://raja-media.onrender.com"
          url=root+"/api/formats?"+urllib.parse.urlencode({"url":video})
          req=urllib.request.Request(url,headers={"User-Agent":"RAJA-quality-check/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=100) as res:
                  metadata=json.load(res)
              print("Formats returned:",metadata.get("choices"))
          except Exception as exc:
              print("SOURCE BLOCK OR UNAVAILABLE: format extraction:",repr(exc))
              raise
          if not any(x.get("format")=="mp3" for x in metadata.get("choices",[])):
              raise SystemExit("No real MP3 format offered")
          url=root+"/api/download?"+urllib.parse.urlencode({"url":video,"format":"mp3","quality":192})
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"RAJA-quality-check/1.0"}),timeout=135) as res:
              start=res.read(16384)
              print("Download HTTP:",res.status,"MIME:",res.headers.get("Content-Type"),"first_bytes:",len(start))
              assert res.status==200 and len(start)>1024
              assert start.startswith(b"ID3") or start[:2] in (b"\\xff\\xfb",b"\\xff\\xf3",b"\\xff\\xf2"),"Not an MP3 payload"
              print("VALID MP3 DATA RECEIVED")
          PY
